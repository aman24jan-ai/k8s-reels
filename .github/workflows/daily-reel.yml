name: Daily Kubernetes Reel

on:
  schedule:
    # IST schedule:
    # 9:00 AM IST = 03:30 UTC
    # 1:00 PM IST = 07:30 UTC
    # 7:00 PM IST = 13:30 UTC
    - cron: "30 03 * * *"
    - cron: "30 07 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only make the video, don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and post today's reel
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          POST_YOUTUBE: ${{ vars.POST_YOUTUBE || 'true' }}
          POST_INSTAGRAM: ${{ vars.POST_INSTAGRAM || 'false' }}
          REEL_LANGUAGE: ${{ vars.REEL_LANGUAGE || 'english' }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/main.py

      - name: Keep the video for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: |
            output/*.mp4
            scripts_log/*.json
          retention-days: 14

      - name: Save progress
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state.json scripts_log || true
          git diff --cached --quiet || git commit -m "Reel posted: day $(python -c 'import json;print(json.load(open("state.json"))["day"])')"
          git push
